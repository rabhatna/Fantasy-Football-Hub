openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Fantasy player rankings and deep-dive metrics
  - name: teams
    description: Team and offensive line context
  - name: injuries
    description: Injury radar and social updates
  - name: draft
    description: Draft state and market overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List fantasy players
      parameters:
        - in: query
          name: position
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: maxAdp
          schema:
            type: number
        - in: query
          name: minShare
          schema:
            type: number
        - in: query
          name: excludeUnhealthy
          schema:
            type: boolean
      responses:
        "200":
          description: Ranked players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player deep-dive metrics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player deep dive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List team context
      responses:
        "200":
          description: Team context rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /news:
    get:
      operationId: getNews
      tags: [injuries]
      summary: List injury and market news
      responses:
        "200":
          description: Recent news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /draft/summary:
    get:
      operationId: getDraftSummary
      tags: [draft]
      summary: Get draft room summary
      responses:
        "200":
          description: Current draft room summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummary"
  /draft/picks:
    get:
      operationId: getDraftPicks
      tags: [draft]
      summary: List drafted players
      responses:
        "200":
          description: Picks saved for this board
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftPick"
    post:
      operationId: saveDraftPick
      tags: [draft]
      summary: Save a drafted player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPickInput"
      responses:
        "201":
          description: Saved draft pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPick"
  /draft/picks/{playerId}:
    delete:
      operationId: deleteDraftPick
      tags: [draft]
      summary: Undo a drafted player
      description: Removes the pick for a player, so a misclick on a persistent board can be corrected.
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Pick removed
        "404":
          description: No pick found for that player
  /notes:
    get:
      operationId: getNotes
      tags: [draft]
      summary: List all player notes
      responses:
        "200":
          description: Saved notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerNote"
  /notes/{playerId}:
    put:
      operationId: savePlayerNote
      tags: [draft]
      summary: Create or replace a player note
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerNoteInput"
      responses:
        "200":
          description: Saved note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerNote"
  /ol-impact:
    get:
      operationId: getOLImpact
      tags: [teams]
      summary: OL composite scores and per-RB impact assessments
      description: Returns a composite offensive line score per team and a per-RB impact assessment derived from joining each RB to their team's line metrics.
      responses:
        "200":
          description: OL impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OLImpactAnalysis"
  /data/refresh:
    post:
      operationId: refreshData
      tags: [draft]
      summary: Refresh cached data
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Player:
      type: object
      required: [id, rank, name, team, position, adp, valueScore, ppg, share, oLineGrade, injuryStatus, byeWeek, tier, durabilityScore, productionFinish, nextGen, consistency, weeklyScores]
      properties:
        id: { type: string }
        rank: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        adp: { type: number }
        valueScore: { type: number }
        ppg: { type: number }
        share: { type: number }
        oLineGrade: { type: number }
        injuryStatus: { type: string }
        byeWeek: { type: number }
        tier: { type: number }
        durabilityScore: { type: number }
        productionFinish: { type: number }
        nextGen:
          type: object
          required: [separation, croe, ryoe, boxCount]
          properties:
            separation: { type: number }
            croe: { type: number }
            ryoe: { type: number }
            boxCount: { type: number }
        consistency:
          type: object
          required: [floor, ceiling, boomRate, bustRate]
          properties:
            floor: { type: number }
            ceiling: { type: number }
            boomRate: { type: number }
            bustRate: { type: number }
        weeklyScores:
          type: array
          items: { type: number }
    Team:
      type: object
      required: [team, fullName, aly, stuffRate, passBlockGrade, proe, snapContinuity, vacatedOpportunity, trend]
      properties:
        team: { type: string }
        fullName: { type: string }
        aly: { type: number }
        stuffRate: { type: number }
        passBlockGrade: { type: number }
        proe: { type: number }
        snapContinuity: { type: number }
        vacatedOpportunity: { type: number }
        trend: { type: string }
    NewsItem:
      type: object
      required: [id, source, author, headline, timestamp, sentiment, status]
      properties:
        id: { type: string }
        source: { type: string }
        author: { type: string }
        headline: { type: string }
        timestamp: { type: string }
        sentiment: { type: string }
        status: { type: string }
        playerId: { type: ["string", "null"] }
    DraftSummary:
      type: object
      required: [playersTracked, draftedCount, averageAdp, valueTargets, positionalNeeds, lastRefresh]
      properties:
        playersTracked: { type: number }
        draftedCount: { type: number }
        averageAdp: { type: number }
        valueTargets: { type: number }
        positionalNeeds:
          type: object
          required: [QB, RB, WR, TE]
          properties:
            QB: { type: number }
            RB: { type: number }
            WR: { type: number }
            TE: { type: number }
        lastRefresh: { type: string }
    DraftPickInput:
      type: object
      required: [playerId, pickNumber]
      properties:
        playerId: { type: string }
        pickNumber: { type: number }
    DraftPick:
      type: object
      description: |
        playerName, team and position are denormalised onto the pick on
        purpose. playerId is derived from the player's name in the current
        dataset and changes when the dataset is refreshed, so these fields are
        what let an existing board be re-linked to new ids — and what make the
        stored CSV readable when opened in a spreadsheet.
      required: [id, playerId, playerName, team, position, pickNumber, draftedAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        position: { type: string }
        pickNumber: { type: number }
        draftedAt: { type: string }
    PlayerNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string }
    PlayerNote:
      type: object
      required: [playerId, playerName, note, updatedAt]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        note: { type: string }
        updatedAt: { type: string }
    OLTeamScore:
      type: object
      required: [team, fullName, compositeScore, aly, stuffRate, passBlockGrade, snapContinuity, trend, tier]
      properties:
        team: { type: string }
        fullName: { type: string }
        compositeScore: { type: number }
        aly: { type: number }
        stuffRate: { type: number }
        passBlockGrade: { type: number }
        snapContinuity: { type: number }
        trend: { type: string }
        tier: { type: string }
    RBOLImpact:
      type: object
      required: [playerId, playerName, team, rank, valueScore, ppg, olCompositeScore, olTier, impactLabel, blurb]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        rank: { type: number }
        valueScore: { type: number }
        ppg: { type: number }
        olCompositeScore: { type: number }
        olTier: { type: string }
        impactLabel: { type: string }
        blurb: { type: string }
    OLImpactAnalysis:
      type: object
      required: [teamScores, rbImpacts]
      properties:
        teamScores:
          type: array
          items:
            $ref: "#/components/schemas/OLTeamScore"
        rbImpacts:
          type: array
          items:
            $ref: "#/components/schemas/RBOLImpact"
    RefreshStatus:
      type: object
      required: [status, refreshedAt, sources]
      properties:
        status: { type: string }
        refreshedAt: { type: string }
        sources:
          type: array
          items: { type: string }

