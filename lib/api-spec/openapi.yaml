openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Fantasy player rankings and deep-dive metrics
  - name: teams
    description: Team and offensive line context
  - name: injuries
    description: Injury radar and social updates
  - name: draft
    description: Draft state and market overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List fantasy players
      parameters:
        - in: query
          name: position
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: maxAdp
          schema:
            type: number
        - in: query
          name: minShare
          schema:
            type: number
        - in: query
          name: excludeUnhealthy
          schema:
            type: boolean
      responses:
        "200":
          description: Ranked players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player deep-dive metrics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player deep dive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List team context
      responses:
        "200":
          description: Team context rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /news:
    get:
      operationId: getNews
      tags: [injuries]
      summary: List injury and market news
      responses:
        "200":
          description: Recent news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /draft/summary:
    get:
      operationId: getDraftSummary
      tags: [draft]
      summary: Get draft room summary
      responses:
        "200":
          description: Current draft room summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummary"
  /draft/picks:
    get:
      operationId: getDraftPicks
      tags: [draft]
      summary: List drafted players
      responses:
        "200":
          description: Picks saved for this board
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftPick"
    post:
      operationId: saveDraftPick
      tags: [draft]
      summary: Save a drafted player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPickInput"
      responses:
        "201":
          description: Saved draft pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPick"
  /draft/picks/{playerId}:
    delete:
      operationId: deleteDraftPick
      tags: [draft]
      summary: Undo a drafted player
      description: Removes the pick for a player, so a misclick on a persistent board can be corrected.
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Pick removed
        "404":
          description: No pick found for that player
  /notes:
    get:
      operationId: getNotes
      tags: [draft]
      summary: List all player notes
      responses:
        "200":
          description: Saved notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerNote"
  /notes/{playerId}:
    put:
      operationId: savePlayerNote
      tags: [draft]
      summary: Create or replace a player note
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerNoteInput"
      responses:
        "200":
          description: Saved note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerNote"
  /ol-impact:
    get:
      operationId: getOLImpact
      tags: [teams]
      summary: OL composite scores and per-RB impact assessments
      description: Returns a composite offensive line score per team and a per-RB impact assessment derived from joining each RB to their team's line metrics.
      responses:
        "200":
          description: OL impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OLImpactAnalysis"
  /live/status:
    get:
      operationId: getLiveStatus
      tags: [injuries]
      summary: State of the live feeds
      description: Read-only. Never performs a network fetch — refreshing is always explicit.
      responses:
        "200":
          description: Current live-feed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
  /data/refresh:
    post:
      operationId: refreshData
      tags: [draft]
      summary: Refresh cached data
      description: |
        Reloads the dataset and draft board from disk and fetches the live
        feeds. This is the only path that makes outbound network requests, and
        it runs only when the user asks for it.
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Player:
      type: object
      description: |
        Nullable fields are nullable because the source data genuinely lacks
        them, and a blank is not a zero. 33 of the 250 players took no 2025
        snaps (rookies, or a missed season) so they have no production at all,
        and Next Gen Stats are only recorded for the positions they apply to —
        separation and catch rate for receivers, rushing yards over expected
        and eight-plus-box rate for backs. Clients must render these as "no
        data", never as 0.
      required: [id, rank, name, team, position, adp, tier, isRookie, nextGen, consistency]
      properties:
        id:
          type: string
          description: nflverse gsis_id — stable across dataset refreshes.
        rank: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        adp: { type: number }
        adpSource: { type: [string, "null"] }
        valueScore:
          type: [number, "null"]
          description: |
            Production-versus-price gap in standard deviations, roughly
            Z(2025 positional finish) - Z(2026 ADP). Positive means the player
            produced better than his draft cost implies. Spans about -3 to
            +2.5 — this is not a 0-10 rating and must not be rendered as one.
        marketVerdict: { type: [string, "null"] }
        ppg: { type: [number, "null"] }
        share:
          type: [number, "null"]
          description: Carry share for backs, target share for pass catchers, null for passers. Computed over weeks the player took a snap.
        oLineGrade: { type: [number, "null"] }
        injuryStatus:
          type: [string, "null"]
          description: |
            Live availability, merged from the injury feed when one has been
            fetched. Null means unknown — either no refresh has run, or the
            source has no record of the player. It never means "healthy".
        injuryBodyPart: { type: [string, "null"] }
        byeWeek: { type: [number, "null"] }
        tier: { type: number }
        durabilityScore: { type: [number, "null"] }
        productionFinish: { type: [number, "null"] }
        age: { type: [number, "null"] }
        isRookie: { type: boolean }
        gamesPlayed: { type: [number, "null"] }
        snapShare: { type: [number, "null"] }
        note:
          type: [string, "null"]
          description: Dataset annotation, e.g. why a player has no 2025 production.
        nextGen:
          type: object
          required: [separation, catchPct, ryoe, boxCount]
          properties:
            separation: { type: [number, "null"] }
            catchPct: { type: [number, "null"] }
            ryoe: { type: [number, "null"] }
            boxCount: { type: [number, "null"] }
        consistency:
          type: object
          required: [floor, median, ceiling, boomRate, bustRate, weeksPlayed]
          properties:
            floor: { type: [number, "null"] }
            median: { type: [number, "null"] }
            ceiling: { type: [number, "null"] }
            boomRate: { type: [number, "null"] }
            bustRate: { type: [number, "null"] }
            weeksPlayed: { type: [number, "null"] }
    Team:
      type: object
      required: [team, fullName, tier, trend, olHealthStatus]
      properties:
        team: { type: string }
        fullName: { type: string }
        aly:
          type: [number, "null"]
          description: Adjusted line yards. Real values span roughly 2.4-3.5.
        stuffRate: { type: [number, "null"], description: Percentage, not a fraction. }
        runBlockGrade: { type: [number, "null"] }
        passBlockGrade: { type: [number, "null"] }
        olGrade: { type: [number, "null"] }
        proe: { type: [number, "null"], description: Pass rate over expected, as a percentage. }
        snapContinuity: { type: [number, "null"], description: Percentage of 2025 OL snaps returning in 2026. }
        vacatedTargets: { type: [number, "null"] }
        vacatedCarries: { type: [number, "null"] }
        vacatedOpportunity: { type: [number, "null"] }
        pointsPerGame: { type: [number, "null"] }
        playsPerGame: { type: [number, "null"] }
        returningStarters: { type: [number, "null"] }
        projectedStarters: { type: [number, "null"] }
        olSnaps2025: { type: [number, "null"] }
        olSnapsReturning: { type: [number, "null"] }
        olHealthScore:
          type: [number, "null"]
          description: >-
            0-100 health of the projected starting five, derived from returning
            snaps and returning starters. The dataset carries no lineman injury
            reporting, so this measures continuity, not game status.
        olHealthStatus:
          type: string
          description: Intact, Degraded, Critical, or Unknown.
        compositeScore: { type: [number, "null"] }
        tier: { type: string }
        trend: { type: string }
    NewsItem:
      type: object
      description: |
        A headline from a public NFL news feed. Fields map to what RSS actually
        provides; there is no sentiment field because sentiment cannot be
        derived from a headline without inventing it. `playerId` is set only
        when exactly one ranked player is named in full — a surname alone is
        too ambiguous to attribute.
      required: [id, source, headline]
      properties:
        id: { type: string }
        source: { type: string }
        author: { type: [string, "null"] }
        headline: { type: string }
        url: { type: [string, "null"] }
        timestamp: { type: [string, "null"] }
        playerId: { type: [string, "null"] }
        playerName: { type: [string, "null"] }
        status:
          type: [string, "null"]
          description: The named player's current availability, when known.
    DraftSummary:
      type: object
      required: [playersTracked, draftedCount, averageAdp, valueTargets, positionalNeeds, lastRefresh, snapshotVersion]
      properties:
        playersTracked: { type: number }
        draftedCount: { type: number }
        averageAdp: { type: number }
        valueTargets:
          type: number
          description: Players whose production materially outran their draft cost (value score of at least +0.5 SD).
        snapshotVersion:
          type: string
          description: Scrape date of the dataset currently loaded, e.g. 2026-08-14.
        positionalNeeds:
          type: object
          required: [QB, RB, WR, TE]
          properties:
            QB: { type: number }
            RB: { type: number }
            WR: { type: number }
            TE: { type: number }
        lastRefresh: { type: string }
    DraftPickInput:
      type: object
      required: [playerId, pickNumber]
      properties:
        playerId: { type: string }
        pickNumber: { type: number }
    DraftPick:
      type: object
      description: |
        playerName, team and position are denormalised onto the pick on
        purpose. playerId is derived from the player's name in the current
        dataset and changes when the dataset is refreshed, so these fields are
        what let an existing board be re-linked to new ids — and what make the
        stored CSV readable when opened in a spreadsheet.
      required: [id, playerId, playerName, team, position, pickNumber, draftedAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        position: { type: string }
        pickNumber: { type: number }
        draftedAt: { type: string }
    PlayerNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string }
    PlayerNote:
      type: object
      required: [playerId, playerName, note, updatedAt]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        note: { type: string }
        updatedAt: { type: string }
    OLTeamScore:
      type: object
      required: [team, fullName, trend, tier]
      properties:
        team: { type: string }
        fullName: { type: string }
        compositeScore: { type: [number, "null"] }
        aly: { type: [number, "null"] }
        stuffRate: { type: [number, "null"] }
        passBlockGrade: { type: [number, "null"] }
        snapContinuity: { type: [number, "null"] }
        trend: { type: string }
        tier: { type: string }
    RBOLImpact:
      type: object
      required: [playerId, playerName, team, rank, olTier, impactLabel, blurb]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        rank: { type: number }
        valueScore: { type: [number, "null"] }
        ppg: { type: [number, "null"] }
        olCompositeScore: { type: [number, "null"] }
        olTier: { type: string }
        impactLabel: { type: string }
        blurb: { type: string }
    OLImpactAnalysis:
      type: object
      required: [teamScores, rbImpacts]
      properties:
        teamScores:
          type: array
          items:
            $ref: "#/components/schemas/OLTeamScore"
        rbImpacts:
          type: array
          items:
            $ref: "#/components/schemas/RBOLImpact"
    RefreshStatus:
      type: object
      required: [status, refreshedAt, sources]
      properties:
        status: { type: string }
        refreshedAt: { type: string }
        live:
          $ref: "#/components/schemas/LiveStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceResult"
    SourceResult:
      type: object
      required: [name, ok, detail]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
    LiveStatus:
      type: object
      description: |
        State of the live feeds. `stale` is true when the most recent attempt
        had any source fail, meaning some of what is being served predates it —
        clients must say so rather than presenting cached data as current.
      required: [stale, sources]
      properties:
        fetchedAt: { type: [string, "null"] }
        attemptedAt: { type: [string, "null"] }
        stale: { type: boolean }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceResult"

