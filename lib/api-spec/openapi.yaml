openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Fantasy player rankings and deep-dive metrics
  - name: teams
    description: Team and offensive line context
  - name: injuries
    description: Injury radar and social updates
  - name: draft
    description: Draft state and market overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List fantasy players
      parameters:
        - in: query
          name: position
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: maxAdp
          schema:
            type: number
        - in: query
          name: minShare
          schema:
            type: number
        - in: query
          name: excludeUnhealthy
          schema:
            type: boolean
      responses:
        "200":
          description: Ranked players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player deep-dive metrics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player deep dive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List team context
      responses:
        "200":
          description: Team context rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /teams/{team}/line:
    get:
      operationId: getTeamLine
      tags: [teams]
      summary: A team's offensive line, with availability
      description: |
        The starting five (and swing men) from the team's ESPN depth chart,
        read left to right, each with any injury designation and the most
        recent cached headline naming him. Empty until depth charts have been
        fetched.
      parameters:
        - name: team
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The line, LT through RT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLine"
        "404":
          description: Unknown team
  /news:
    get:
      operationId: getNews
      tags: [injuries]
      summary: List injury and market news
      responses:
        "200":
          description: Recent news items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /draft/summary:
    get:
      operationId: getDraftSummary
      tags: [draft]
      summary: Get draft room summary
      responses:
        "200":
          description: Current draft room summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSummary"
  /draft/recommendations:
    get:
      operationId: getRecommendations
      tags: [draft]
      summary: Suggested next picks
      description: |
        Ranked suggestions for the user's next pick, derived server-side from
        the full draft state: consensus ADP vs their actual remaining snake
        picks, roster needs net of keepers, market value, tier scarcity,
        projections, injuries and bye overlaps. Each suggestion carries its
        reasons. Empty when the roster is full.
      responses:
        "200":
          description: Ranked suggestions, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /draft/picks:
    get:
      operationId: getDraftPicks
      tags: [draft]
      summary: List drafted players
      responses:
        "200":
          description: Picks saved for this board
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DraftPick"
    post:
      operationId: saveDraftPick
      tags: [draft]
      summary: Save a drafted player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPickInput"
      responses:
        "201":
          description: Saved draft pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPick"
  /draft/picks/{playerId}:
    delete:
      operationId: deleteDraftPick
      tags: [draft]
      summary: Undo a drafted player
      description: Removes the pick for a player, so a misclick on a persistent board can be corrected.
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Pick removed
        "404":
          description: No pick found for that player
  /keepers:
    get:
      operationId: getKeepers
      tags: [draft]
      summary: List keepers
      responses:
        "200":
          description: Keepers saved for this league
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keeper"
    post:
      operationId: saveKeeper
      tags: [draft]
      summary: Save a keeper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeeperInput"
      responses:
        "201":
          description: Saved keeper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keeper"
  /keepers/import:
    post:
      operationId: importKeepers
      tags: [draft]
      summary: Import keepers from a CSV sheet
      description: |
        Bulk-loads keepers from CSV text with a `player,team,owner,round,dollars`
        header. `owner` is "me" for the user's own keepers or the league team's
        name; `team` disambiguates duplicate player names and may be blank;
        exactly one of `round`/`dollars` should carry the cost. Rows that do
        not match a ranked player are reported back, not silently dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeeperImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeeperImportResult"
        "400":
          description: Unparseable CSV
  /keepers/{id}:
    delete:
      operationId: deleteKeeper
      tags: [draft]
      summary: Remove a keeper
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Keeper removed
        "404":
          description: No keeper with that id
  /notes:
    get:
      operationId: getNotes
      tags: [draft]
      summary: List all player notes
      responses:
        "200":
          description: Saved notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerNote"
  /notes/{playerId}:
    put:
      operationId: savePlayerNote
      tags: [draft]
      summary: Create or replace a player note
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerNoteInput"
      responses:
        "200":
          description: Saved note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerNote"
  /settings:
    get:
      operationId: getSettings
      tags: [draft]
      summary: Get league settings
      description: Returns the saved league configuration, or the defaults when none has been saved yet.
      responses:
        "200":
          description: Current league settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettings"
    put:
      operationId: updateSettings
      tags: [draft]
      summary: Replace league settings
      description: Replaces the whole settings document. Positional needs and scoring-dependent numbers change immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueSettings"
      responses:
        "200":
          description: Saved league settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSettings"
        "400":
          description: Invalid settings (for example a draft slot beyond the team count)
  /ol-impact:
    get:
      operationId: getOLImpact
      tags: [teams]
      summary: OL composite scores and per-RB impact assessments
      description: Returns a composite offensive line score per team and a per-RB impact assessment derived from joining each RB to their team's line metrics.
      responses:
        "200":
          description: OL impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OLImpactAnalysis"
  /live/status:
    get:
      operationId: getLiveStatus
      tags: [injuries]
      summary: State of the live feeds
      description: Read-only. Never performs a network fetch — refreshing is always explicit.
      responses:
        "200":
          description: Current live-feed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
  /data/refresh:
    post:
      operationId: refreshData
      tags: [draft]
      summary: Refresh cached data
      description: |
        Reloads the dataset and draft board from disk and fetches the live
        feeds. This is the only path that makes outbound network requests, and
        it runs only when the user asks for it.
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Player:
      type: object
      description: |
        Nullable fields are nullable because the source data genuinely lacks
        them, and a blank is not a zero. 33 of the 250 players took no 2025
        snaps (rookies, or a missed season) so they have no production at all,
        and Next Gen Stats are only recorded for the positions they apply to —
        separation and catch rate for receivers, rushing yards over expected
        and eight-plus-box rate for backs. Clients must render these as "no
        data", never as 0.
      required: [id, rank, name, team, position, adp, adpConsensus, adpConsensusStdev, adpSources, valueScoreConsensus, depthRank, projectedPoints, aav, tier, isRookie, nextGen, consistency]
      properties:
        id:
          type: string
          description: nflverse gsis_id — stable across dataset refreshes.
        rank: { type: number }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        adp: { type: number }
        adpSource: { type: [string, "null"] }
        adpConsensus:
          type: [number, "null"]
          description: |
            Mean ADP across every source that knows the player: the live
            market sources (FFC mocks, Sleeper, ESPN) plus the dataset's own
            ADP column. Null until a refresh has fetched market data — the
            plain `adp` is the fallback then.
        adpConsensusStdev:
          type: [number, "null"]
          description: Spread across the sources that went into the consensus. Null with fewer than two sources.
        adpSources:
          type: array
          description: Every ADP that went into the consensus, per source. Empty until a refresh has fetched market data.
          items:
            type: object
            required: [source, adp]
            properties:
              source: { type: string }
              adp: { type: number }
        valueScoreConsensus:
          type: [number, "null"]
          description: |
            The dataset's value score recomputed against consensus ADP instead
            of the single-source ADP column, on the same SD scale. Computed
            locally, so it can differ slightly from the pipeline's number;
            null until market data has been fetched.
        depthRank:
          type: [number, "null"]
          description: |
            The player's rank on his team's ESPN depth chart at his position
            (1 = starter; for receivers it is the overall WR pecking order).
            Null until depth charts have been fetched or when the chart does
            not list him.
        projectedPoints:
          type: [number, "null"]
          description: |
            Projected 2026 season total in the league's scoring format, from
            the cached market sources. Null when no source projects the
            player — never a zero, which would read as "projected to score
            nothing".
        aav:
          type: [number, "null"]
          description: |
            Average auction value in league dollars, from live ESPN drafts.
            Null before the first market refresh or for players the crowd is
            not bidding on.
        valueScore:
          type: [number, "null"]
          description: |
            Production-versus-price gap in standard deviations, roughly
            Z(2025 positional finish) - Z(2026 ADP). Positive means the player
            produced better than his draft cost implies. Spans about -3 to
            +2.5 — this is not a 0-10 rating and must not be rendered as one.
        marketVerdict: { type: [string, "null"] }
        ppg: { type: [number, "null"] }
        share:
          type: [number, "null"]
          description: Carry share for backs, target share for pass catchers, null for passers. Computed over weeks the player took a snap.
        oLineGrade: { type: [number, "null"] }
        injuryStatus:
          type: [string, "null"]
          description: |
            Live availability, merged from the injury feed when one has been
            fetched. Null means unknown — either no refresh has run, or the
            source has no record of the player. It never means "healthy".
        injuryBodyPart: { type: [string, "null"] }
        byeWeek: { type: [number, "null"] }
        tier: { type: number }
        durabilityScore: { type: [number, "null"] }
        productionFinish: { type: [number, "null"] }
        age: { type: [number, "null"] }
        isRookie: { type: boolean }
        gamesPlayed: { type: [number, "null"] }
        snapShare: { type: [number, "null"] }
        note:
          type: [string, "null"]
          description: Dataset annotation, e.g. why a player has no 2025 production.
        nextGen:
          type: object
          required: [separation, catchPct, ryoe, boxCount]
          properties:
            separation: { type: [number, "null"] }
            catchPct: { type: [number, "null"] }
            ryoe: { type: [number, "null"] }
            boxCount: { type: [number, "null"] }
        consistency:
          type: object
          required: [floor, median, ceiling, boomRate, bustRate, weeksPlayed]
          properties:
            floor: { type: [number, "null"] }
            median: { type: [number, "null"] }
            ceiling: { type: [number, "null"] }
            boomRate: { type: [number, "null"] }
            bustRate: { type: [number, "null"] }
            weeksPlayed: { type: [number, "null"] }
    Team:
      type: object
      required: [team, fullName, tier, trend, olHealthStatus]
      properties:
        team: { type: string }
        fullName: { type: string }
        aly:
          type: [number, "null"]
          description: Adjusted line yards. Real values span roughly 2.4-3.5.
        stuffRate: { type: [number, "null"], description: Percentage, not a fraction. }
        runBlockGrade: { type: [number, "null"] }
        passBlockGrade: { type: [number, "null"] }
        olGrade: { type: [number, "null"] }
        proe: { type: [number, "null"], description: Pass rate over expected, as a percentage. }
        snapContinuity: { type: [number, "null"], description: Percentage of 2025 OL snaps returning in 2026. }
        vacatedTargets: { type: [number, "null"] }
        vacatedCarries: { type: [number, "null"] }
        vacatedOpportunity: { type: [number, "null"] }
        pointsPerGame: { type: [number, "null"] }
        playsPerGame: { type: [number, "null"] }
        returningStarters: { type: [number, "null"] }
        projectedStarters: { type: [number, "null"] }
        olSnaps2025: { type: [number, "null"] }
        olSnapsReturning: { type: [number, "null"] }
        olHealthScore:
          type: [number, "null"]
          description: >-
            0-100 health of the projected starting five, derived from returning
            snaps and returning starters. The dataset carries no lineman injury
            reporting, so this measures continuity, not game status.
        olHealthStatus:
          type: string
          description: Intact, Degraded, Critical, or Unknown.
        compositeScore: { type: [number, "null"] }
        tier: { type: string }
        trend: { type: string }
    Lineman:
      type: object
      required: [slot, rank, name, injuryStatus, injuryBodyPart, headline, headlineUrl]
      properties:
        slot:
          type: string
          description: LT, LG, C, RG or RT.
        rank:
          type: number
          description: 1 = the starter at the slot, 2 = the swing man.
        name: { type: string }
        injuryStatus: { type: [string, "null"] }
        injuryBodyPart: { type: [string, "null"] }
        headline:
          type: [string, "null"]
          description: The most recent cached headline naming this lineman, if any.
        headlineUrl: { type: [string, "null"] }
    TeamLine:
      type: object
      required: [team, linemen]
      properties:
        team: { type: string }
        linemen:
          type: array
          items:
            $ref: "#/components/schemas/Lineman"
    NewsItem:
      type: object
      description: |
        A headline from a public NFL news feed. Fields map to what RSS actually
        provides; there is no sentiment field because sentiment cannot be
        derived from a headline without inventing it. `playerId` is set only
        when exactly one ranked player is named in full — a surname alone is
        too ambiguous to attribute.
      required: [id, source, headline]
      properties:
        id: { type: string }
        source: { type: string }
        author: { type: [string, "null"] }
        headline: { type: string }
        url: { type: [string, "null"] }
        timestamp: { type: [string, "null"] }
        playerId: { type: [string, "null"] }
        playerName: { type: [string, "null"] }
        status:
          type: [string, "null"]
          description: The named player's current availability, when known.
    DraftSummary:
      type: object
      required: [playersTracked, draftedCount, averageAdp, valueTargets, positionalNeeds, remainingPicks, myRoster, lastRefresh, snapshotVersion]
      properties:
        playersTracked: { type: number }
        draftedCount: { type: number }
        averageAdp: { type: number }
        valueTargets:
          type: number
          description: Players whose production materially outran their draft cost (value score of at least +0.5 SD).
        snapshotVersion:
          type: string
          description: Scrape date of the dataset currently loaded, e.g. 2026-08-14.
        positionalNeeds:
          type: object
          description: |
            Starting spots still to fill at each position, derived from the
            league settings roster net of drafted players. FLEX counts RB/WR/TE
            drafted beyond their base spots.
          required: [QB, RB, WR, TE, FLEX]
          properties:
            QB: { type: number }
            RB: { type: number }
            WR: { type: number }
            TE: { type: number }
            FLEX: { type: number }
        remainingPicks:
          type: array
          description: |
            The user's picks still to come, in snake order from their settings
            (team count, draft slot, rounds = total roster spots). Rounds
            consumed by their round-cost keepers are gone, and each pick made
            uses up the earliest remaining slot.
          items:
            type: object
            required: [round, overall]
            properties:
              round: { type: number }
              overall: { type: number }
        myRoster:
          type: array
          description: Everyone on the user's team so far — keepers first, then picks.
          items:
            type: object
            required: [playerId, playerName, position, source]
            properties:
              playerId: { type: string }
              playerName: { type: string }
              position: { type: string }
              source:
                type: string
                enum: [keeper, pick]
        lastRefresh: { type: string }
    LeagueSettings:
      type: object
      description: |
        The league this draft board is for. One document, replaced whole; the
        server clamps and defaults rather than failing on partial garbage, but
        rejects settings that contradict themselves.
      required: [teamCount, scoring, draftType, draftSlot, auctionBudget, missingRounds, roster]
      properties:
        teamCount:
          type: number
          minimum: 4
          maximum: 20
        scoring:
          type: string
          enum: [ppr, half_ppr, standard]
        draftType:
          type: string
          enum: [snake, auction]
        draftSlot:
          type: number
          minimum: 1
          maximum: 20
          description: The user's position in the draft order, 1..teamCount.
        auctionBudget:
          type: number
          minimum: 1
        missingRounds:
          type: array
          description: Rounds the user has no pick in (traded away); removed from the remaining-picks math.
          items:
            type: number
            minimum: 1
        roster:
          type: object
          description: Starting spots per position, plus bench depth.
          required: [QB, RB, WR, TE, FLEX, K, DST, BENCH]
          properties:
            QB: { type: number, minimum: 0 }
            RB: { type: number, minimum: 0 }
            WR: { type: number, minimum: 0 }
            TE: { type: number, minimum: 0 }
            FLEX: { type: number, minimum: 0 }
            K: { type: number, minimum: 0 }
            DST: { type: number, minimum: 0 }
            BENCH: { type: number, minimum: 0 }
    DraftPickInput:
      type: object
      required: [playerId]
      properties:
        playerId: { type: string }
        pickNumber:
          type: number
          description: |
            Optional; when omitted the server assigns the user's next
            remaining overall pick (accounting for keeper-consumed rounds),
            which is the authoritative number.
    DraftPick:
      type: object
      description: |
        playerName, team and position are denormalised onto the pick on
        purpose. playerId is derived from the player's name in the current
        dataset and changes when the dataset is refreshed, so these fields are
        what let an existing board be re-linked to new ids — and what make the
        stored CSV readable when opened in a spreadsheet.
      required: [id, playerId, playerName, team, position, pickNumber, draftedAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        position: { type: string }
        pickNumber: { type: number }
        draftedAt: { type: string }
    KeeperImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: The sheet's contents as CSV text.
        replace:
          type: boolean
          description: When true, existing keepers are cleared before the import. Default false (merge).
    KeeperImportResult:
      type: object
      required: [imported, skipped, keepers]
      properties:
        imported: { type: number }
        skipped:
          type: array
          description: Rows that could not be imported, with the 1-based CSV line and why.
          items:
            type: object
            required: [line, reason]
            properties:
              line: { type: number }
              reason: { type: string }
        keepers:
          type: array
          items:
            $ref: "#/components/schemas/Keeper"
    Recommendation:
      type: object
      description: |
        One suggested pick. `score` is a weighted blend of the components —
        useful for ordering, not a rating to display on its own. `reasons`
        are the argument, in plain language.
      required: [playerId, name, team, position, score, reasons, components]
      properties:
        playerId: { type: string }
        name: { type: string }
        team: { type: string }
        position: { type: string }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
        components:
          type: object
          required: [availability, need, value, scarcity, projection, injury, bye]
          properties:
            availability: { type: number }
            need: { type: number }
            value: { type: number }
            scarcity: { type: number }
            projection: { type: number }
            injury: { type: number }
            bye: { type: number }
    KeeperInput:
      type: object
      required: [playerId, owner, costType, costValue]
      properties:
        playerId: { type: string }
        owner:
          type: string
          enum: [me, other]
          description: Whose team keeps the player. "other" only removes him from the pool.
        ownerName:
          type: string
          description: The league team's name, for grouping keepers by team. Ignored when owner is "me".
        costType:
          type: string
          enum: [round, dollars]
        costValue:
          type: number
          minimum: 0
          description: The round the keeper consumes (snake) or the dollars he costs (auction).
    Keeper:
      type: object
      description: |
        playerName, team and position are denormalised for the same reason as
        draft picks — playerId can change across dataset refreshes, and the
        CSV should read cleanly in a spreadsheet.
      required: [id, playerId, playerName, team, position, owner, ownerName, costType, costValue, createdAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        position: { type: string }
        owner:
          type: string
          enum: [me, other]
        ownerName:
          type: string
          description: The league team keeping him; empty when it is the user's own keeper.
        costType:
          type: string
          enum: [round, dollars]
        costValue: { type: number }
        createdAt: { type: string }
    PlayerNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string }
    PlayerNote:
      type: object
      required: [playerId, playerName, note, updatedAt]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        note: { type: string }
        updatedAt: { type: string }
    OLTeamScore:
      type: object
      required: [team, fullName, trend, tier]
      properties:
        team: { type: string }
        fullName: { type: string }
        compositeScore: { type: [number, "null"] }
        aly: { type: [number, "null"] }
        stuffRate: { type: [number, "null"] }
        passBlockGrade: { type: [number, "null"] }
        snapContinuity: { type: [number, "null"] }
        trend: { type: string }
        tier: { type: string }
    RBOLImpact:
      type: object
      required: [playerId, playerName, team, rank, olTier, impactLabel, blurb]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        rank: { type: number }
        valueScore: { type: [number, "null"] }
        ppg: { type: [number, "null"] }
        olCompositeScore: { type: [number, "null"] }
        olTier: { type: string }
        impactLabel: { type: string }
        blurb: { type: string }
    OLImpactAnalysis:
      type: object
      required: [teamScores, rbImpacts]
      properties:
        teamScores:
          type: array
          items:
            $ref: "#/components/schemas/OLTeamScore"
        rbImpacts:
          type: array
          items:
            $ref: "#/components/schemas/RBOLImpact"
    RefreshStatus:
      type: object
      required: [status, refreshedAt, sources]
      properties:
        status: { type: string }
        refreshedAt: { type: string }
        live:
          $ref: "#/components/schemas/LiveStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceResult"
    SourceResult:
      type: object
      required: [name, ok, detail]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
    LiveStatus:
      type: object
      description: |
        State of the live feeds. `stale` is true when the most recent attempt
        had any source fail, meaning some of what is being served predates it —
        clients must say so rather than presenting cached data as current.
      required: [stale, sources]
      properties:
        fetchedAt: { type: [string, "null"] }
        attemptedAt: { type: [string, "null"] }
        stale: { type: boolean }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceResult"

